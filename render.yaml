services:
  - type: web
    name: gym-logger
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_REPO_URL
        value: https://github.com/reinisvaravs/gym_logger_frontend.git
      - key: FRONTEND_BRANCH
        value: main
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
